name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; queue them instead of cancelling, so a half-applied
# D1 migration can't be interrupted by the next push.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # .env.local is gitignored, so VITE_CLOUD has to be supplied here.
      # Without it Vite tree-shakes the entire auth/picker/sync path out of the
      # bundle (44 kB -> 20 kB) and the deploy silently becomes a local-only app
      # with no login and no sync. The guard below is what catches that.
      - name: Build
        run: npm run build
        env:
          VITE_CLOUD: '1'

      - name: Verify this is a cloud build
        run: |
          missing=0
          for marker in 'nodebook|v1|' '/auth/signin' 'pk-new'; do
            if ! grep -rqF -- "$marker" dist/assets/; then
              echo "::error::Missing '$marker' in dist/ — this is a local-only bundle. Is VITE_CLOUD set?"
              missing=1
            fi
          done
          exit $missing

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply nodebook --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
