# The one and only deploy pipeline for this project.
#
# Do NOT also connect this repo under Workers -> Builds in the Cloudflare
# dashboard: both would fire on every push, racing each other, and Workers
# Builds does not apply D1 migrations — so a schema change could land after the
# code that depends on it.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; queue them instead of cancelling, so a half-applied
# D1 migration can't be interrupted by the next push.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # wrangler.toml's [build] hook means `wrangler deploy` would build anyway.
      # This step exists so the guard below runs *before* anything is uploaded —
      # don't delete it as a duplicate. It costs ~2s.
      - name: Build
        run: npm run build

      # Cloud mode is the default, so this should never fire — it exists to catch
      # a regression that reintroduces a flag-gated build. A local-only bundle has
      # auth, picker and sync tree-shaken out (44 kB -> 20 kB) and deploys happily.
      - name: Verify this is a cloud build
        run: |
          missing=0
          for marker in 'nodebook|v1|' '/auth/signin' 'pk-new'; do
            if ! grep -rqF -- "$marker" dist/assets/; then
              echo "::error::Missing '$marker' in dist/ — this is a local-only bundle."
              missing=1
            fi
          done
          exit $missing

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply nodebook --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
