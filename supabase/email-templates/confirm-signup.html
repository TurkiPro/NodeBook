<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#0e0e10;font-family:Helvetica,Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0e0e10;padding:48px 16px;">
    <tr>
      <td align="center">

        <table width="400" cellpadding="0" cellspacing="0" border="0"
          style="background:#16161a;border:1px solid #26262d;border-radius:8px;max-width:400px;width:100%;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding:36px 40px 0;">
              <span style="font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:500;font-style:italic;color:#e8e6e1;letter-spacing:-0.01em;">
                node<span style="color:#d4a574;">·</span>book
              </span>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:24px 40px 0;">
              <div style="height:1px;background:#26262d;"></div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td align="center" style="padding:32px 40px 0;">
              <p style="margin:0 0 8px;font-family:Georgia,'Times New Roman',serif;font-size:18px;font-style:italic;color:#e8e6e1;">
                Confirm your email
              </p>
              <p style="margin:0;font-size:13px;color:#8a8a93;line-height:1.7;">
                Click the button below to activate your Nodebook account<br>and start building your graph.
              </p>
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td align="center" style="padding:28px 40px;">
              <a href="{{ .ConfirmationURL }}"
                style="display:inline-block;background:#8a6b48;color:#e8e6e1;text-decoration:none;
                       font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
                       padding:13px 36px;border-radius:4px;font-family:Helvetica,Arial,sans-serif;">
                Confirm account
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:0 40px 32px;">
              <div style="height:1px;background:#26262d;margin-bottom:24px;"></div>
              <p style="margin:0;font-size:11px;color:#55555c;line-height:1.7;text-align:center;">
                If you didn't create a Nodebook account, you can safely ignore this email.
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
